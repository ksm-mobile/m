<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>KSM POS</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#020617;font-family:Arial,sans-serif}
      .deploy-help{box-sizing:border-box;max-width:720px;margin:80px auto;padding:24px;color:#e2e8f0;background:#0f172a;border:1px solid #334155;border-radius:18px;line-height:1.6}
      .deploy-help h1{margin-top:0;color:#60a5fa}
      .deploy-help code{background:#020617;padding:3px 7px;border-radius:6px;color:#fbbf24}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="deploy-help">
        <h1>KSM POS is waiting for the GitHub Pages build</h1>
        <p>If this message remains on screen, open the repository and choose <code>Settings → Pages → Source → GitHub Actions</code>, then run <code>Actions → Deploy KSM POS</code>.</p>
        <p>The completed website will replace this message automatically.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
